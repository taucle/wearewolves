        }

            font-size: 1.1em;
        }

        #keep-turn-message {
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 15px 30px;
            border: 2px solid black; /* Bordure noire pour le style de l'image */
            border-radius: 5px;
            font-size: 1.5em;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
